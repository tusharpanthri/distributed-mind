name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy engines/ benchmark/ data/ --ignore-missing-imports

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Java (for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run unit tests
        run: pytest -m "not integration" -v --timeout=120

  integration-tests:
    name: Integration Tests (MinIO + 50k sample)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: unit-tests

    env:
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET_RAW: raw-data
      MINIO_BUCKET_OUTPUT: processed-data

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Java (for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      # Service containers can't pass a command, and the MinIO image needs
      # `server /data`, so MinIO is started as an explicit step instead.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2024-05-01T01-11-10Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1

      - name: Create MinIO buckets
        run: |
          python - <<'EOF'
          from minio import Minio
          client = Minio("localhost:9000", access_key="minioadmin", secret_key="minioadmin", secure=False)
          for bucket in ["raw-data", "processed-data"]:
              if not client.bucket_exists(bucket):
                  client.make_bucket(bucket)
          print("Buckets created")
          EOF

      - name: Download sample GH Archive data (50k rows, 1 hour)
        run: |
          python -m data.download_gharchive_data \
            --date 2024-01-15 \
            --hours 1 \
            --sample-size 50000

      - name: Build amplified-skew dataset
        run: python -m data.amplify_skew

      - name: Run integration tests (data integrity, skew mitigation, fault tolerance)
        run: pytest -m integration -v --timeout=600

  cluster-smoke:
    name: Cluster Smoke (Spark/Dask/Ray multi-node)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30

    env:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      CLUSTER_WORKERS: "1"
      CLUSTER_WORKER_CORES: "2"

    steps:
      - uses: actions/checkout@v4

      - name: Build benchmark image
        run: docker compose build benchmark

      - name: Start MinIO and the three clusters
        run: |
          docker compose -f docker-compose.yml -f docker-compose.cluster.yml up -d             minio minio-init spark-master spark-worker dask-scheduler dask-worker ray-head ray-worker

      - name: Ingest sample data
        run: |
          docker compose run --rm benchmark -m data.download_gharchive_data             --date 2024-01-15 --hours 1 --sample-size 50000

      # Engines fail fast if no worker registers, so this asserts the drivers
      # really reached the Spark master / Dask scheduler / Ray head.
      - name: Run one job per engine against the clusters
        run: |
          docker compose -f docker-compose.yml -f docker-compose.cluster.yml run --rm benchmark             -m benchmark.runner --engines spark,dask,ray             --datasets balanced --mitigation off --no-warmup             --cluster-workers 1 --output results/cluster_smoke.json

      - name: Assert every engine succeeded with matching row counts
        run: |
          python - <<'PY'
          import json
          results = json.load(open("results/cluster_smoke.json"))["results"]
          assert len(results) == 3, results
          for r in results:
              assert r["success"], (r["engine_name"], r["error_message"])
              assert r["worker_count"] == 1, r
          outputs = {r["engine_name"]: r["rows_output"] for r in results}
          assert len(set(outputs.values())) == 1, outputs
          print("cluster smoke OK:", outputs)
          PY

      - name: Cluster logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.cluster.yml logs             --tail 100 spark-master spark-worker dask-scheduler dask-worker ray-head ray-worker

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose file
        run: docker compose config -q

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: distributedmind:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
