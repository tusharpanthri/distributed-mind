minio:
  endpoint: "${MINIO_ENDPOINT:http://localhost:9000}"
  access_key: "${MINIO_ROOT_USER:minioadmin}"
  secret_key: "${MINIO_ROOT_PASSWORD:minioadmin}"
  bucket_raw: "${MINIO_BUCKET_RAW:raw-data}"
  bucket_output: "${MINIO_BUCKET_OUTPUT:processed-data}"

data:
  gharchive_base_url: "https://data.gharchive.org"
  default_date: "2024-01-15"
  default_hours: 24
  sample_size: 50000        # rows cap for CI; 0 = no cap
  raw_prefix: "events"      # raw-data/events/date=YYYY-MM-DD/
  skewed_prefix: "events-skewed"  # raw-data/events-skewed/date=YYYY-MM-DD/ (amplify_skew.py)
  lookup_key: "lookup/repo_metadata.parquet"
  # One Parquet file per date would be a single partition/block for every
  # engine, capping parallelism (and OOM-ing a worker at 24h scale).
  rows_per_file: 250000

benchmark:
  engines:
    - spark
    - dask
    - ray
  output_dir: "results"
  # Declarative workload spec; --workload overrides it. See config/workloads/.
  workload: "${WORKLOAD_SPEC:config/workloads/gharchive-repo-activity.yaml}"
  input_path: "s3a://raw-data/events"
  skewed_input_path: "s3a://raw-data/events-skewed"
  output_path: "s3a://processed-data/output"
  lookup_path: "s3a://raw-data/lookup/repo_metadata.parquet"

# Engines run in local mode by default. The docker-compose.cluster.yml overlay
# sets these env vars to point the driver at real Spark/Dask/Ray clusters.
spark:
  master: "${SPARK_MASTER_URL:local[4]}"   # local[4] matches dask (2x2) and ray (4)
  app_name: "DistributedMind-Benchmark"
  # S3A settings injected at runtime via SparkConf

dask:
  scheduler_address: "${DASK_SCHEDULER_ADDRESS:}"   # empty -> LocalCluster
  n_workers: 2
  threads_per_worker: 2
  memory_limit: "2GB"

ray:
  address: "${RAY_ADDRESS:}"                        # empty -> local ray.init()
  num_cpus: 4
  object_store_memory: 1073741824   # 1 GB

cluster:
  # Reporting labels only; the overlay and scripts/scaling_sweep.py set these.
  workers: "${CLUSTER_WORKERS:0}"            # 0 = local mode
  worker_cores: "${CLUSTER_WORKER_CORES:2}"

skew:
  amplify_top_n: 5          # repos replicated by data/amplify_skew.py
  skew_factor: 10           # total copies of each hot-repo row
  hot_key_top_n: 10         # repos the engines treat as hot when mitigating
  salt_buckets: 8           # sub-keys per hot repo (Spark/Dask); Ray uses 2x as blocks

fault_tolerance:
  max_retries: 3
  backoff_base_seconds: 0.5 # delay = min(max, base * 2^attempt)
  backoff_max_seconds: 8.0

observability:
  # Batch jobs exit before Prometheus can scrape them, so metrics are pushed
  # to a Pushgateway that Prometheus scrapes. Empty = don't push.
  pushgateway: "${PUSHGATEWAY_URL:}"
