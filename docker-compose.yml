
services:
  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object store
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-01T01-11-10Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # MinIO bucket initialiser — creates buckets then exits
  # ---------------------------------------------------------------------------
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-04-18T16-45-29Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/raw-data &&
        mc mb --ignore-existing local/processed-data &&
        echo 'Buckets ready.'
      "
    restart: "no"

  # ---------------------------------------------------------------------------
  # Benchmark — runs the full pipeline
  # ---------------------------------------------------------------------------
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      minio-init:
        condition: service_completed_successfully
      pushgateway:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      PUSHGATEWAY_URL: pushgateway:9091
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_RAW: raw-data
      MINIO_BUCKET_OUTPUT: processed-data
      # botocore >=1.36 defaults to checksum headers this MinIO release
      # rejects on bulk-delete/overwrite calls (used by Dask's to_parquet).
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    # Ray's object store falls back to slow /tmp when /dev/shm is Docker's 64 MB default.
    shm_size: "1gb"
    volumes:
      - ./results:/app/results
      - ./config:/app/config
    # Full matrix: 3 engines × {balanced, skewed} × mitigation {off, on}.
    # Assumes data is ingested (download_gharchive_data + amplify_skew).
    command:
      - "-m"
      - "benchmark.runner"
      - "--engines"
      - "spark,dask,ray"
      - "--repeats"
      - "3"
      - "--metrics-port"
      - "8000"

  # ---------------------------------------------------------------------------
  # Observability — benchmark pushes metrics to the Pushgateway (it's a batch
  # job), Prometheus scrapes the gateway, Grafana loads the dashboard on start.
  # ---------------------------------------------------------------------------
  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports:
      - "9091:9091"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9091/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      pushgateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"   # http://localhost:3000 (anonymous viewer, or admin/admin)
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/distributedmind.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  minio_data:
  prometheus_data:
